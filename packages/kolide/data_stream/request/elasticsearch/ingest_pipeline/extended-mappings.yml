---
description: >-
  Extended field extraction for Kolide request records. Normalizes the request
  state to lowercase and derives event.outcome from it (approved -> success,
  denied/rejected -> failure, pending -> unknown). Request state is resolved
  upstream in default.yml (API) and webhook.yml (webhook deliveries).
processors:
  - lowercase:
      field: kolide.request.state
      tag: lowercase_state
      ignore_missing: true
  - set:
      field: event.outcome
      tag: set_outcome_success
      value: success
      if: ctx.kolide?.request?.state == 'approved'
  - set:
      field: event.outcome
      tag: set_outcome_failure
      value: failure
      if: ctx.kolide?.request?.state == 'denied' || ctx.kolide?.request?.state == 'rejected'
  - set:
      field: event.outcome
      tag: set_outcome_unknown
      value: unknown
      if: ctx.kolide?.request?.state == 'pending'

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
