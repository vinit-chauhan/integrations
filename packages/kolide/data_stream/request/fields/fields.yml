- name: kolide.request
  type: group
  description: Custom fields for Kolide approval-workflow requests, collected from the REST API and request webhooks.
  fields:
    - name: id
      type: keyword
      description: Kolide request identifier.
    - name: type
      type: keyword
      description: Type of request, either `exemption` or `registration`.
    - name: state
      type: keyword
      description: Normalized request state, for example `pending`, `approved`, or `denied`.
    - name: message
      type: match_only_text
      description: Human-entered request message or reason.
    - name: created_at
      type: date
      description: Timestamp at which the request was created.
    - name: updated_at
      type: date
      description: Timestamp at which the request was last updated.
    - name: device
      type: group
      description: Device referenced by the request.
      fields:
        - name: url
          type: keyword
          description: API URL of the referenced device.
    - name: requester
      type: group
      description: Requester referenced by the request.
      fields:
        - name: url
          type: keyword
          description: API URL of the referenced requester.
    - name: issues
      type: flattened
      description: Issues referenced by an exemption request.
