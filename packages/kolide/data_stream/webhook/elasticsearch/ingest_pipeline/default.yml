---
description: >-
  Receives all Kolide webhook events on a single endpoint. Routing to the
  appropriate data stream (auth, issues, device, audit) is handled by the
  routing_rules.yml declarations which compile to reroute processors.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
