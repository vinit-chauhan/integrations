---
description: >-
  Pipeline for categorizing ECS event fields for Kolide issue events. Maps the
  resolved event.action to event.kind/category using an exact lookup table.
  Issues are security/compliance findings: event.kind: event with the
  configuration category. event.type is creation for a newly detected/open issue
  and change for a resolved or updated issue (resolved_at set, or the
  issues.resolved webhook action). event.outcome (open -> failure, resolved ->
  success) is assigned in default.yml and is left untouched here.
processors:
  - script:
      lang: painless
      tag: set_ecs_categorization
      description: Map Kolide issue event.action to ECS categorization fields using exact lookups.
      if: ctx.event?.action != null
      params:
        exact:
          issue: { kind: event, category: ['configuration'] }
          issues.new: { kind: event, category: ['configuration'] }
          issues.resolved: { kind: event, category: ['configuration'] }
      source: |-
        def action = ctx.event.action;
        def m = params.exact.get(action);
        if (m != null) {
          ctx.event.kind = m.kind;
          ctx.event.category = new ArrayList(m.category);
        } else {
          ctx.event.kind = 'event';
          ctx.event.category = ['configuration'];
        }

        // A resolved/updated issue is a change; a newly detected issue is a creation.
        boolean resolved = (ctx.kolide?.issues?.resolved_at != null) || (action == 'issues.resolved');
        ctx.event.type = resolved ? ['change'] : ['creation'];

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
