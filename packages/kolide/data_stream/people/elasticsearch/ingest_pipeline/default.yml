---
description: >-
  Parse Kolide people records from GET /people (CEL). See https://www.kolide.com/docs/.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.4.0'

  # --- CEL input only (Agentless metadata + collector error placeholders) ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  # --- end CEL-only ---

  # CEL / JSE00001: `message` is a JSON string of one GET /people record.
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json_cel
      if: ctx.json == null && ctx.event?.original != null
      description: Decode the CEL message (a JSON string of one person object) into the working json object.

  # The /people API is a state snapshot with no record timestamp; use ingest time.
  - set:
      field: '@timestamp'
      copy_from: _ingest.timestamp
      tag: set_timestamp_api_ingest

  - set:
      field: event.kind
      tag: set_event_kind
      value: state
  - append:
      field: event.category
      tag: append_event_category_iam
      value: iam
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_user
      value: user
      allow_duplicates: false
  - append:
      field: event.type
      tag: append_event_type_info
      value: info
      allow_duplicates: false

  # ECS identity.
  - convert:
      field: json.id
      target_field: user.id
      type: string
      tag: convert_user_id
      ignore_missing: true
  - set:
      field: user.email
      tag: set_user_email
      copy_from: json.email
      if: ctx.json?.email instanceof String
  - set:
      field: user.full_name
      tag: set_user_full_name
      copy_from: json.name
      if: ctx.json?.name instanceof String
  - set:
      field: user.name
      tag: set_user_name_from_username
      copy_from: json.username
      if: ctx.json?.username instanceof String
  - set:
      field: user.name
      tag: set_user_name_from_email
      copy_from: user.email
      if: ctx.user?.name == null && ctx.user?.email instanceof String

  # Kolide custom people fields.
  - set:
      field: kolide.people.id
      tag: set_kolide_people_id
      copy_from: user.id
      if: ctx.user?.id != null
  - rename:
      field: json.status
      target_field: kolide.people.status
      tag: rename_status
      ignore_missing: true
  - lowercase:
      field: kolide.people.status
      tag: lowercase_status
      ignore_missing: true
  - rename:
      field: json.role
      target_field: kolide.people.role
      tag: rename_role
      ignore_missing: true
  - rename:
      field: json.groups
      target_field: kolide.people.groups
      tag: rename_groups
      ignore_missing: true
  - rename:
      field: json.person_groups
      target_field: kolide.people.person_groups
      tag: rename_person_groups
      ignore_missing: true
  - rename:
      field: json.idp_id
      target_field: kolide.people.idp.id
      tag: rename_idp_id
      ignore_missing: true
  - rename:
      field: json.idp_identifier
      target_field: kolide.people.idp.identifier
      tag: rename_idp_identifier
      ignore_missing: true
  - rename:
      field: json.idp_name
      target_field: kolide.people.idp.name
      tag: rename_idp_name
      ignore_missing: true
  - rename:
      field: json.scim_id
      target_field: kolide.people.scim.id
      tag: rename_scim_id
      ignore_missing: true
  - rename:
      field: json.mdm_user_id
      target_field: kolide.people.mdm.user_id
      tag: rename_mdm_user_id
      ignore_missing: true
  - rename:
      field: json.created_at
      target_field: kolide.people.created_at
      tag: rename_created_at
      ignore_missing: true
  - date:
      field: kolide.people.created_at
      target_field: kolide.people.created_at
      formats:
        - ISO8601
      tag: date_created_at
      if: ctx.kolide?.people?.created_at != null
  - rename:
      field: json.updated_at
      target_field: kolide.people.updated_at
      tag: rename_updated_at
      ignore_missing: true
  - date:
      field: kolide.people.updated_at
      target_field: kolide.people.updated_at
      formats:
        - ISO8601
      tag: date_updated_at
      if: ctx.kolide?.people?.updated_at != null
  - rename:
      field: json.deprovisioned
      target_field: kolide.people.deprovisioned
      tag: rename_deprovisioned
      ignore_missing: true

  # Keep any additional API attributes without losing schema stability.
  - remove:
      field:
        - json.id
        - json.email
        - json.name
        - json.username
      tag: remove_mapped_identity_fields
      ignore_missing: true
  - rename:
      field: json
      target_field: kolide.people.extra
      tag: rename_extra_fields
      ignore_missing: true

  # related.* enrichment.
  - append:
      field: related.user
      tag: append_related_user_email
      value: '{{{user.email}}}'
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      field: related.user
      tag: append_related_user_name
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_related_user_id
      value: '{{{user.id}}}'
      allow_duplicates: false
      if: ctx.user?.id != null

  # Deduplication: /people is a full snapshot. Fingerprint person id to _id so
  # repeated polls upsert the current state for the same person.
  - fingerprint:
      fields:
        - event.original
      target_field: _id
      method: SHA-256
      tag: fingerprint_user_id
      if: ctx.event?.original != null && ctx.event.original != ''

  # Cleanup.
  - remove:
      field:
        - data
      tag: remove_temp_fields
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null
  - script:
      description: Drops null/empty values recursively.
      tag: script_to_drop_null_values
      lang: painless
      source: |-
        boolean drop(Object object) {
          if (object == null || object == '') {
            return true;
          } else if (object instanceof Map) {
            ((Map) object).values().removeIf(v -> drop(v));
            return (((Map) object).size() == 0);
          } else if (object instanceof List) {
            ((List) object).removeIf(v -> drop(v));
            return (((List) object).length == 0);
          }
          return false;
        }
        drop(ctx);

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
