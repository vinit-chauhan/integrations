wait_for_data_timeout: 1m
service: kolide-auth-webhook
service_notify_signal: SIGHUP
input: http_endpoint
data_stream:
  vars:
    listen_address: 0.0.0.0
    listen_port: 9551
    url: /kolide/auth
    secret_header: X-Kolide-Webhook-Identifier
    secret_value: kolide-auth-test-identifier
    preserve_original_event: true
assert:
  hit_count: 2
