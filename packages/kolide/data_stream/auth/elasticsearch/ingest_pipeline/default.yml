---
description: Pipeline for processing Kolide auth_log (authentication session) events from the REST API (CEL) and webhooks.
processors:
  - set:
      field: ecs.version
      tag: set_ecs_version
      value: '9.3.0'

  # --- CEL input only ---
  - remove:
      field:
        - organization
        - division
        - team
      ignore_missing: true
      if: ctx.organization instanceof String && ctx.division instanceof String && ctx.team instanceof String
      tag: remove_agentless_tags
      description: >-
        Removes the fields added by Agentless as metadata,
        as they can collide with ECS fields.
  - terminate:
      tag: data_collection_error
      if: ctx.error?.message != null && ctx.message == null && ctx.event?.original == null
      description: error message set and no data to process.
  # --- end CEL-only ---

  # Webhook path: the body is delivered at the document root, where the `event`
  # key is a string that would collide with the ECS `event` object. Capture the
  # raw body into event.original and move the envelope into the working `json`
  # object so both inputs converge on the same shape.
  - rename:
      field: event
      tag: rename_webhook_event_envelope
      target_field: json.event
      ignore_missing: true
      if: ctx.event instanceof String
      description: Move the webhook envelope `event` (a string) out of the way of the ECS `event` object.
  - script:
      lang: painless
      tag: move_webhook_envelope_to_json
      if: ctx.json?.event != null && ctx.data != null
      description: Move the remaining webhook envelope fields into the working json object. event.original is set by the input when preserve_original_event is enabled.
      source: |-
        if (ctx.containsKey('id')) { ctx.json.id = ctx.remove('id'); }
        if (ctx.containsKey('timestamp')) { ctx.json.timestamp = ctx.remove('timestamp'); }
        if (ctx.containsKey('data')) { ctx.json.data = ctx.remove('data'); }

  # --- CEL / JSE00001 path: message holds the raw JSON of one auth_log_session (or sub-event) ---
  - rename:
      field: message
      tag: rename_message_to_event_original
      target_field: event.original
      ignore_missing: true
      description: Renames the original `message` field to `event.original` to store a copy of the original message. The `event.original` field is not touched if the document already has one; it may happen when Logstash sends the document.
      if: ctx.event?.original == null
  - remove:
      field: message
      tag: remove_message
      ignore_missing: true
      description: The `message` field is no longer required if the document has an `event.original` field.
      if: ctx.event?.original != null
  - json:
      field: event.original
      target_field: json
      tag: parse_json_cel
      if: ctx.json == null && ctx.event?.original != null
      description: Decode the CEL message (a JSON string of one auth_log_session or sub-event) into the working json object.

  # --- Common normalization (json now holds either the API object or the webhook envelope) ---
  # When CEL expands a session into sub-events, json.timestamp is the sub-event timestamp
  # and json.session_timestamp is the original session start time.
  - date:
      field: json.timestamp
      target_field: '@timestamp'
      formats:
        - ISO8601
      tag: date_timestamp
      if: ctx.json?.timestamp != null

  - date:
      field: json.session_timestamp
      target_field: event.start
      formats:
        - ISO8601
      tag: date_session_start
      if: ctx.json?.session_timestamp != null && ctx.json.session_timestamp != ''

  - set:
      field: event.kind
      tag: set_event_kind
      value: event
  - append:
      field: event.category
      tag: append_event_category
      value:
        - authentication
        - session
  - append:
      field: event.type
      tag: append_event_type
      value:
        - start
        - info

  # kolide.auth.session_id: the authentication session identifier, shared across all
  # sub-events of the same session so they can be correlated. From the API/webhook record `id`.
  - set:
      field: kolide.auth.session_id
      tag: set_session_id
      copy_from: json.id
      ignore_empty_value: true
      if: ctx.json?.id != null && ctx.json.id != ''

  # event.id: composite ID for API sub-events (session_id:sub_event_type:timestamp),
  # or the session/envelope ID for sessions without sub-events and webhooks.
  - set:
      field: event.id
      tag: set_event_id_sub_event
      value: '{{{json.id}}}:{{{json.sub_event_type}}}:{{{json.timestamp}}}'
      if: ctx.json?.sub_event_type != null && ctx.json?.sub_event_type != ''
  - rename:
      field: json.id
      target_field: event.id
      tag: rename_event_id
      ignore_missing: true
      if: ctx.event?.id == null

  # event.action: sub-event type for API sub-events, webhook event value, or "auth_log" fallback.
  - set:
      field: event.action
      tag: set_event_action_sub_event
      copy_from: json.sub_event_type
      ignore_empty_value: true
      if: ctx.json?.sub_event_type != null && ctx.json?.sub_event_type != ''
  - rename:
      field: json.event
      target_field: event.action
      tag: rename_event_action_webhook
      ignore_missing: true
  - set:
      field: event.action
      tag: set_event_action_api
      value: auth_log
      if: ctx.event?.action == null

  # message: human-readable description of the sub-event (API path with sub-events only).
  - set:
      field: message
      tag: set_message_sub_event
      copy_from: json.sub_event_description
      ignore_empty_value: true
      if: ctx.json?.sub_event_description != null && ctx.json?.sub_event_description != ''

  # event.outcome: from API result, or from webhook event action
  - set:
      field: event.outcome
      tag: set_outcome_success_api
      value: success
      if: ctx.json?.result == 'Success'
  - set:
      field: event.outcome
      tag: set_outcome_failure_api
      value: failure
      if: ctx.json?.result == 'Fail'
  - set:
      field: event.outcome
      tag: set_outcome_success_webhook
      value: success
      if: ctx.event?.action == 'auth_logs.success'
  - set:
      field: event.outcome
      tag: set_outcome_failure_webhook
      value: failure
      if: ctx.event?.action == 'auth_logs.failure'

  # --- User ---
  - rename:
      field: json.person_name
      target_field: user.name
      tag: rename_user_name
      ignore_missing: true
  - rename:
      field: json.person_email
      target_field: user.email
      tag: rename_user_email
      ignore_missing: true
  - rename:
      field: json.person_info.identifier
      target_field: user.id
      tag: rename_user_id_api
      ignore_missing: true
  - convert:
      field: json.data.person_id
      target_field: user.id
      type: string
      tag: convert_user_id_webhook
      ignore_missing: true

  # --- Host (device) ---
  - rename:
      field: json.data.device_name
      target_field: host.name
      tag: rename_host_name_webhook
      ignore_missing: true
  - convert:
      field: json.data.device_id
      target_field: host.id
      type: string
      tag: convert_host_id_webhook
      ignore_missing: true
  - rename:
      field: json.device_info.identifier
      target_field: host.id
      tag: rename_host_id_api
      ignore_missing: true
  - set:
      field: host.hostname
      tag: set_host_hostname
      copy_from: host.name
      if: ctx.host?.name != null

  # --- Source IP (API only) + geo enrichment ---
  - rename:
      field: json.ip_address
      target_field: source.ip
      tag: rename_source_ip
      ignore_missing: true
  - geoip:
      field: source.ip
      target_field: source.geo
      ignore_missing: true
      if: ctx.source?.ip != null
      tag: enrich_source_geo
  - geoip:
      database_file: GeoLite2-ASN.mmdb
      field: source.ip
      target_field: source.as
      properties:
        - asn
        - organization_name
      ignore_missing: true
      if: ctx.source?.ip != null
      tag: enrich_source_asn
  - rename:
      field: source.as.asn
      target_field: source.as.number
      ignore_missing: true
      tag: rename_source_asn
  - rename:
      field: source.as.organization_name
      target_field: source.as.organization.name
      ignore_missing: true
      tag: rename_source_as_org
  # Vendor-provided geo as a fallback when GeoIP misses.
  - rename:
      field: json.country
      target_field: source.geo.country_name
      tag: rename_geo_country_fallback
      ignore_missing: true
      if: ctx.source?.geo?.country_name == null
  - remove:
      field: json.country
      tag: remove_redundant_country
      ignore_missing: true
  - rename:
      field: json.city
      target_field: source.geo.city_name
      tag: rename_geo_city_fallback
      ignore_missing: true
      if: ctx.source?.geo?.city_name == null
  - remove:
      field: json.city
      tag: remove_redundant_city
      ignore_missing: true

  # --- User agent ---
  - rename:
      field: json.browser_name
      target_field: user_agent.name
      tag: rename_ua_name_api
      ignore_missing: true
  - rename:
      field: json.data.browser_name
      target_field: user_agent.name
      tag: rename_ua_name_webhook
      ignore_missing: true
  - rename:
      field: json.data.browser_version
      target_field: user_agent.version
      tag: rename_ua_version_webhook
      ignore_missing: true
  - rename:
      field: json.browser_user_agent
      target_field: user_agent.original
      tag: rename_ua_original_api
      ignore_missing: true
  - user_agent:
      field: user_agent.original
      ignore_missing: true
      if: ctx.user_agent?.original != null
      tag: enrich_user_agent

  # --- Kolide custom fields ---
  - rename:
      field: json.agent_version
      target_field: kolide.auth.agent_version
      tag: rename_agent_version_api
      ignore_missing: true
  - rename:
      field: json.data.launcher_version
      target_field: kolide.auth.agent_version
      tag: rename_agent_version_webhook
      ignore_missing: true
  - rename:
      field: json.result
      target_field: kolide.auth.result
      tag: rename_result
      ignore_missing: true
  - rename:
      field: json.initial_status
      target_field: kolide.auth.initial_status
      tag: rename_initial_status
      ignore_missing: true
  - rename:
      field: json.okta_app_name
      target_field: kolide.auth.okta.app_name
      tag: rename_okta_app_name
      ignore_missing: true
  - rename:
      field: json.okta_app_instance_id
      target_field: kolide.auth.okta.app_instance_id
      tag: rename_okta_app_instance_id
      ignore_missing: true
  - rename:
      field: json.data.auth_log_url
      target_field: kolide.auth.url
      tag: rename_auth_log_url
      ignore_missing: true
  - rename:
      field: json.issues_displayed
      target_field: kolide.auth.issues_displayed
      tag: rename_issues_displayed
      ignore_missing: true

  # --- related.* enrichment ---
  - append:
      field: related.ip
      tag: append_related_source_ip
      value: '{{{source.ip}}}'
      allow_duplicates: false
      if: ctx.source?.ip != null
  - append:
      field: related.user
      tag: append_related_user_name
      value: '{{{user.name}}}'
      allow_duplicates: false
      if: ctx.user?.name != null
  - append:
      field: related.user
      tag: append_related_user_email
      value: '{{{user.email}}}'
      allow_duplicates: false
      if: ctx.user?.email != null
  - append:
      field: related.hosts
      tag: append_related_hosts
      value: '{{{host.name}}}'
      allow_duplicates: false
      if: ctx.host?.name != null

  # --- Extended field extraction from message/description ---
  - pipeline:
      name: '{{ IngestPipeline "extended-mappings" }}'
      tag: extended_mappings
      ignore_missing_pipeline: true

  # --- Deduplication ---
  # The CEL cursor uses an inclusive (>=) timestamp boundary on purpose to avoid
  # skipping events that share the boundary second, so each poll re-collects the
  # last record(s). Set a deterministic _id from event.id so those re-collected
  # records overwrite rather than duplicate the previously ingested documents.
  - fingerprint:
      fields:
        - event.id
      target_field: _id
      method: SHA-256
      tag: fingerprint_event_id
      if: ctx.event?.id != null && ctx.event.id != ''

  # --- Cleanup ---
  - remove:
      field:
        - json
        - data
      tag: remove_temp_fields
      ignore_missing: true
  - append:
      field: tags
      tag: append_preserve_original_event
      value: preserve_original_event
      allow_duplicates: false
      if: ctx.error?.message != null

on_failure:
  - append:
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}failed with message '{{{ _ingest.on_failure_message }}}'
  - set:
      field: event.kind
      tag: set_pipeline_error_to_event_kind
      value: pipeline_error
  - append:
      field: tags
      value: preserve_original_event
      allow_duplicates: false
