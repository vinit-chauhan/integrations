wait_for_data_timeout: 1m
service: kolide-audit-webhook
service_notify_signal: SIGHUP
input: http_endpoint
data_stream:
  vars:
    listen_address: 0.0.0.0
    listen_port: 9554
    url: /kolide/audit
    secret_header: X-Kolide-Webhook-Identifier
    secret_value: kolide-audit-test-identifier
    preserve_original_event: true
assert:
  hit_count: 1
