# newer versions go on top
- version: "0.2.8"
  changes:
    - description: >-
        Changed the device data stream to re-collect the full device inventory on every poll
        (the /devices API exposes no modified-since cursor) and to fingerprint the document `_id`
        on the raw record content (`event.original`). Unchanged devices overwrite in place, while
        any field change is captured as a new document, so device updates are no longer missed.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.7"
  changes:
    - description: >-
        Classified audit log events by setting `event.action` to the documented Kolide event
        name (snake_case, e.g. `device_registration_approved`, `webhook_created`), derived from
        the description. Events whose description matches no known pattern retain the generic
        `audit_log` (API) / webhook event value.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
    - description: >-
        Expanded audit log extended parsing to cover every documented Kolide audit event
        category (checks, devices, device registrations, exemption requests, people, managed
        web apps, groups, log pipeline, live queries, Okta webhooks, billing, end-user portal,
        automatic device removal, restrictions, admin users, SSO, integrations, device
        management providers, and developers). Where the description observed in real instance
        data differs from the documented template, both variants are now supported.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
    - description: >-
        Separated the REST API (CEL) and webhook ingest logic on the auth, audit, device, and
        issues data streams. Each `default.yml` now handles only API-collected records and
        delegates webhook deliveries to a dedicated `webhook.yml` pipeline.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.6"
  changes:
    - description: >-
        Fixed duplicate ingestion from the REST API on the auth, audit, device, and issues
        data streams. The collection cursor now tracks the exact most-recent record timestamp
        (no longer leaving the lookback window pinned), and a deterministic document `_id`
        (SHA-256 fingerprint of `event.id`) deduplicates the small boundary overlap that the
        API's inclusive timestamp filter re-returns, without risking skipped events.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
    - description: >-
        Fixed an auth CEL compilation error by replacing the unsupported three-argument
        `map` macro, and keep the raw auth sub-events array in `event.original` instead of
        indexing it as a separate field.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.5"
  changes:
    - description: >-
        Fixed the path to the sample log file in the `send_kolide_webhooks.py` script.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.4"
  changes:
    - description: >-
        Major refactoring of the ingest pipelines to improve log parsing and field mapping.
        Split auth sub-events into separate records to improve correlation and reduce noise.
        Added extended field extraction from message/description to improve searchability.
        Added related.hosts, related.user, and related.ip enrichment.
        Added ECS user.target.email promotion from kolide.audit.target.user_email.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.3"
  changes:
    - description: >-
        Added static `X-Kolide-Api-Version` request header to the Kolide REST API requests.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.2"
  changes:
    - description: >-
        Added dynamic dataset and namespace support to the `webhook` data stream.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.1"
  changes:
    - description: >-
        Fixed the path to the sample log file in the `send_kolide_webhooks.py` script.
      type: bugfix
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.2.0"
  changes:
    - description: >-
        Replaced per-stream webhook inputs with a single centralized `webhook` data stream that receives all Kolide webhook events on one endpoint and routes them to the appropriate data stream (auth, issues, device, audit) via the reroute processor. Users now configure one webhook endpoint in Kolide instead of four.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
- version: "0.1.0"
  changes:
    - description: Initial release of the Kolide integration.
      type: enhancement
      link: https://github.com/elastic/integrations/pull/1 # FIXME Replace with the real PR link
