version: '2.3'
services:
  kolide-auth:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: kolide-auth
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-auth.yml
  kolide-issues:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: kolide-issues
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-issues.yml
  kolide-device:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: kolide-device
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-device.yml
  kolide-audit:
    image: docker.elastic.co/observability/stream:v0.20.0
    hostname: kolide-audit
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-audit.yml
  kolide-auth-webhook:
    image: docker.elastic.co/observability/stream:v0.20.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    environment:
      - STREAM_PROTOCOL=webhook
      - STREAM_WEBHOOK_PROBE=false
      - STREAM_ADDR=http://elastic-agent:9551/kolide/auth
      - STREAM_WEBHOOK_HEADER=X-Kolide-Webhook-Identifier=kolide-auth-test-identifier
    command: log --start-signal=SIGHUP --delay=5s /sample_logs/kolide-auth.log
  kolide-issues-webhook:
    image: docker.elastic.co/observability/stream:v0.20.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    environment:
      - STREAM_PROTOCOL=webhook
      - STREAM_WEBHOOK_PROBE=false
      - STREAM_ADDR=http://elastic-agent:9552/kolide/issues
      - STREAM_WEBHOOK_HEADER=X-Kolide-Webhook-Identifier=kolide-issues-test-identifier
    command: log --start-signal=SIGHUP --delay=5s /sample_logs/kolide-issues.log
  kolide-device-webhook:
    image: docker.elastic.co/observability/stream:v0.20.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    environment:
      - STREAM_PROTOCOL=webhook
      - STREAM_WEBHOOK_PROBE=false
      - STREAM_ADDR=http://elastic-agent:9553/kolide/device
      - STREAM_WEBHOOK_HEADER=X-Kolide-Webhook-Identifier=kolide-device-test-identifier
    command: log --start-signal=SIGHUP --delay=5s /sample_logs/kolide-device.log
  kolide-audit-webhook:
    image: docker.elastic.co/observability/stream:v0.20.0
    volumes:
      - ./sample_logs:/sample_logs:ro
    environment:
      - STREAM_PROTOCOL=webhook
      - STREAM_WEBHOOK_PROBE=false
      - STREAM_ADDR=http://elastic-agent:9554/kolide/audit
      - STREAM_WEBHOOK_HEADER=X-Kolide-Webhook-Identifier=kolide-audit-test-identifier
    command: log --start-signal=SIGHUP --delay=5s /sample_logs/kolide-audit.log
